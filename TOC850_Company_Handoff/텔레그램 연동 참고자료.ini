텔레그램 개인 맞춤형 알람 시스템 구축 계획서 (N:M 기준치 매핑 모델)

단일 텔레그램 봇을 활용하여 각 계측기(Device)의 알람 기준치(Threshold)를 관리하고, 계측값이 이를 초과할 경우 해당 계측기를 구독한 사용자들에게만 실시간으로 알람을 개별 라우팅하는 시스템 구축 계획입니다.

1. 시스템 아키텍처 및 데이터 흐름

[계측기 N] ──(1) 데이터 송신 (값) ──> [Vercel Router] 
                                            │
                                    (2) 임계값/구독자 조회
                                            ▼
                                     [Supabase DB]
                                            │ (조건 평가: 현재값 > 임계값)
                                            ▼
[대상 사용자 M] <──(4) 개별 메시지 발송 ── [Bot API 호출] (조건 충족 시)


계측 데이터 송신: 계측기가 주기적으로 또는 이벤트 발생 시 현재 계측값을 Vercel 라우터 엔드포인트로 전송합니다.

임계값 및 구독자 쿼리: Vercel 라우터는 Supabase DB에서 해당 계측기의 기준치(Threshold)와 이 계측기를 구독 중인 사용자들의 chat_id 목록을 조회합니다.

조건 평가: Vercel 라우터 내부에서 현재 계측값 > 임계값 여부를 평가합니다.

알람 발송: 조건이 참(True)일 경우에만, 텔레그램 Bot API를 통해 구독자 리스트의 각 chat_id로 커스텀 경고 메시지를 전송합니다.

2. 데이터베이스 설계 (Supabase)

계측기의 임계값 관리 및 N:M 구독 관계를 충족하기 위해 devices 테이블을 명시적으로 추가하고 관계를 정규화합니다.

-- 1. 사용자 마스터 테이블
CREATE TABLE users (
    chat_id BIGINT PRIMARY KEY,
    user_name VARCHAR(100) NOT NULL,
    created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 2. 계측기 마스터 테이블 (기준치 포함)
CREATE TABLE devices (
    device_name VARCHAR(100) PRIMARY KEY,
    threshold DOUBLE PRECISION NOT NULL, -- 알람 기준치 (예: 온도, 습도, 압력 등 숫자로 표현되는 임계값)
    created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 3. N:M 구독 매핑 테이블
CREATE TABLE alarm_subscriptions (
    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    chat_id BIGINT REFERENCES users(chat_id) ON DELETE CASCADE,
    device_name VARCHAR(100) REFERENCES devices(device_name) ON DELETE CASCADE,
    created_at TIMESTAMPTZ DEFAULT NOW(),
    UNIQUE(chat_id, device_name) -- 중복 구독 방지 유니크 제약조건
);


3. 구성 요소별 세부 구현 가이드

3.1 Vercel 라우터 웹훅 엔드포인트 (/api/trigger-alarm)

계측 장비들이 데이터를 포스팅하는 접점입니다. 단순히 알람 여부의 불리언 값(true/false)을 받는 것이 아니라, 계측기의 실제 정량적 값을 수신하여 서버 측에서 임계치 초과 여부를 연산합니다.

API Request Payload (POST):

{
  "device_name": "Sensor_Temp_01",
  "current_value": 84.5
}


Vercel 백엔드 핸들러 로직:

페이로드에서 device_name과 current_value를 추출합니다.

Supabase에서 계측기 임계치 정보 및 구독자 목록을 Single Query로 조인하여 가져옵니다.

SELECT 
    d.threshold,
    s.chat_id,
    u.user_name
FROM devices d
LEFT JOIN alarm_subscriptions s ON d.device_name = s.device_name
LEFT JOIN users u ON s.chat_id = u.chat_id
WHERE d.device_name = 'Sensor_Temp_01';


반환된 데이터의 threshold 값과 요청으로 받은 current_value를 비교합니다.

발송 조건: current_value > threshold

발송 조건을 만족할 경우, 조회된 chat_id 배열을 돌며 텔레그램 sendMessage API를 호출합니다.

메시지 포맷 예시:

⚠️ [알람] Sensor_Temp_01 임계치 초과
현재 계측값: 84.5 (기준치: 80.0)
대상자: 홍길동님, 상황을 확인해 주시기 바랍니다.

3.2 텔레그램 봇 등록 프로세스 대응 수정

사용자가 장치를 등록할 때, 데이터의 무결성을 보장하기 위해 devices 테이블에 해당 장치가 이미 선언되어 있는지 검증하는 단계를 추가합니다.

봇 대화 단계:

유저가 장치 이름을 전송 (예: Sensor_Temp_01).

봇 백엔드는 devices 테이블에 device_name = 'Sensor_Temp_01' 데이터가 존재하는지 먼저 확인합니다.

존재하지 않는 장치명일 경우: 등록 반려 또는 기본 임계값과 함께 신규 장비 등록 처리(운영 환경 정책에 따라 결정).

존재하는 장치명일 경우: alarm_subscriptions 테이블에 (chat_id, device_name) 저장 및 등록 완료 메시지 반환.

4. 에이전트 개발 시 핵심 가이드라인

수치 비교 데이터 타입 일치: Supabase의 threshold 필드 타입과 계측기가 송신하는 current_value의 타입이 Float/Double 계열로 일치하는지 항상 검증하십시오.

기준치 동적 수정 인터페이스: 추후 요구사항 확장을 대비하여 관리자가 텔레그램 봇 명령어(예: /set_threshold [장치명] [값])를 통해 devices 테이블의 threshold를 즉시 업데이트할 수 있는 구조를 고려해 두는 것이 좋습니다.